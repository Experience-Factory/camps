:root{color-scheme:dark;--black:#101212;--panel:#1a1d1e;--line:#2c3033;--text:#f4f5f6;--muted:#9aa1a7;--red:#E30513}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--black);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:3px solid var(--red)}
.top img{height:34px}
.lang{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-width:560px;margin:0 auto;padding:12px 16px}
.langwrap{border-bottom:1px solid var(--line)}
.lang button{font:600 16px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:44px;border-radius:10px;border:1px solid #4a5055;background:var(--panel);color:var(--text);cursor:pointer}
.lang button.on{background:var(--red);border-color:var(--red);color:#fff}
.testbar{background:#f5c400;color:#101212;font-weight:700;text-align:center;padding:8px 12px;font-size:14px}
main{max-width:560px;margin:0 auto;padding:22px 16px 40px}
.kick{font-family:EFB;font-size:13px;letter-spacing:3px;color:var(--red)}
h1{font-family:EFB;font-size:32px;line-height:1.08;margin:6px 0 10px}
h2{font-family:EFB;font-size:20px;margin:28px 0 2px}
.bar{width:90px;height:6px;background:var(--red);margin:0 0 16px}
p.lead{color:#d6dadd;margin:0 0 14px}
ul.info{list-style:none;margin:0 0 6px;padding:14px 16px;background:var(--panel);border-radius:14px}
ul.info li{position:relative;padding-left:18px;margin:6px 0}
ul.info li::before{content:"";position:absolute;left:0;top:.55em;width:8px;height:8px;background:var(--red)}
label.f{display:block;font-size:13px;color:var(--muted);margin:16px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
label.f small{text-transform:none;letter-spacing:0;font-weight:400}
input[type=text],input[type=email],input[type=tel],input[type=date],select,textarea{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:#0b0c0c;color:var(--text)}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);border-color:transparent}
#last{text-transform:uppercase}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.choice{display:flex;gap:10px;flex-wrap:wrap}
.choice label{flex:1 1 140px;display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:#0b0c0c;font-size:16px}
.choice input{width:20px;height:20px;accent-color:var(--red);margin:0}
.consent{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border-radius:12px;padding:14px;margin-top:14px;font-size:15px}
.consent input{width:24px;height:24px;flex:0 0 24px;accent-color:var(--red);margin-top:1px}
.total{margin-top:22px;font-family:EFB;font-size:22px;text-align:right}
.send{font-family:EFB;font-size:21px;width:100%;margin-top:12px;padding:16px;border-radius:14px;border:0;background:var(--red);color:#fff}
.send:disabled{opacity:.55}
.err{color:#ff6b73;font-weight:600;margin-top:12px;min-height:1.2em}
.note{color:var(--muted);font-size:13px;margin-top:18px}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
.bank{background:var(--panel);border-left:4px solid var(--red);border-radius:0 12px 12px 0;padding:14px 16px;margin:14px 0;font-size:16px;line-height:1.7}
.bank b{font-family:EFB;font-weight:700}
.btn{display:inline-block;margin-top:16px;font-size:16px;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font-weight:600}
.hidden{display:none!important}
</style>
</head>

    <div><label class="f" for="first" data-t="first"></label>
      <input type="text" id="first" autocomplete="off" autocapitalize="words" maxlength="40"></div>
    <div><label class="f" for="last" data-t="last"></label>
      <input type="text" id="last" autocomplete="off" autocapitalize="characters" maxlength="60"></div>
  </div>
  <div class="row2">
    <div><label class="f" for="dob" data-t="dob"></label><input type="date" id="dob" min="2005-01-01" max="2024-12-31"></div>
    <div><label class="f" for="kidLang" data-t="kidLang"></label>
      <select id="kidLang"><option value=""></option><option value="NL" data-t="kNL"></option><option value="EN" data-t="kEN"></option><option value="FR" data-t="kFR"></option><option value="Other" data-t="other"></option></select></div>
  </div>
  <label class="f" for="level" data-t="level"></label>
  <select id="level"><option value=""></option><option value="Beginner" data-t="lv1"></option>
    <option value="Casual" data-t="lv2"></option><option value="Regular" data-t="lv3"></option></select>
  <label class="f" for="size"><span data-t="size"></span> <small data-t="optional"></small></label>
  <select id="size"><option value=""></option><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
  <label class="f" for="allergies"><span data-t="allergies"></span> <small data-t="optional"></small></label>
  <textarea id="allergies" maxlength="300"></textarea>
  <label class="f" for="doctor" data-t="doctor"></label>
  <input type="text" id="doctor" maxlength="120">

  <h2 data-t="parentH"></h2>
  <label class="f" for="parent" data-t="parent"></label>
  <input type="text" id="parent" autocomplete="name" maxlength="80">
  <div class="row2">
    <div><label class="f" for="phone" data-t="phone"></label><input type="tel" id="phone" autocomplete="tel" maxlength="30"></div>
    <div><label class="f" for="email" data-t="email"></label><input type="email" id="email" autocomplete="email" maxlength="120"></div>
  </div>
  <label class="f" for="address" data-t="address"></label>
  <input type="text" id="address" autocomplete="street-address" maxlength="200">
  <div class="hp"><label>Website <input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>

  <label class="consent"><input type="checkbox" id="ok"><span data-t="consent"></span></label>
  <label class="consent"><input type="checkbox" id="photos"><span><span data-t="photos"></span> <span style="color:var(--muted)" data-t="optionalP"></span></span></label>

  <div class="total" id="total"></div>
  <button class="send" id="send" data-t="send"></button>
  <div class="err" id="err"></div>
  <p class="note" data-t="privacy"></p>
</main>

<main id="doneView" class="hidden">
  <div class="kick">CARNAVAL CAMP 2027</div>
  <h1 data-t="thanks"></h1><div class="bar"></div>
  <p class="lead" id="thanksText"></p>
  <div class="bank"><span class=""><span data-t="holder"></span> <b>Experience Factory Antwerp bv</b><br></span><span data-t="ibanL"></span> <b>BE66 0689 5332 7343</b><br><span data-t="bicL"></span> <b>GKCCBEBB</b><br><span data-t="comm"></span> <b id="ref"></b><br><span data-t="amount"></span> <b id="dep"></b></div>
  <button class="btn" id="again" type="button" data-t="another"></button>
</main>

<main id="fullView" class="hidden">
  <div class="kick">CARNAVAL CAMP 2027</div>
  <h1 data-t="fullT"></h1><div class="bar"></div>
  <p class="lead" data-t="fullText"></p>
</main>

<script>
(() => {
'use strict';
const API = 'https://script.google.com/macros/s/AKfycbysjZ62O14u80ybJW6so9CsByWsnRwEwOlixb0ivHe56-H-Ff6LkdNIT69hOO70TmwBLA/exec', CAMP = 'carnaval-2027', REF = '2027 - Carnaval Camp';
const PRICE = 500, NIGHTS = 0, DEPOSIT = 275;
const T = {"nl": {"title": "Inschrijving Carnaval Camp", "lead": "In de krokusvakantie kart je kind vijf dagen bij Experience Factory Antwerp, van maandag 8 tot en met vrijdag 12 februari 2027.", "prog": "Kartingtheorie, rijden op de piste, races met podiumceremonie en tussendoor sport- en avontuuractiviteiten.", "langs": "Het kamp gaat door in het Nederlands en het Engels.", "price": "€ 500 per kind, maaltijden en drankjes inbegrepen.", "deposit": "Je inschrijving is definitief zodra we het voorschot van € 275 ontvangen hebben.", "balance": "Het saldo betaal je ten laatste op de eerste kampdag aan het onthaal.", "one": "Vul per kind een apart formulier in.", "kidH": "Gegevens van je kind", "first": "Voornaam", "last": "Familienaam", "dob": "Geboortedatum", "kidLang": "Welke taal spreekt je kind?", "kNL": "Nederlands", "kEN": "Engels", "kFR": "Frans", "other": "Andere taal", "level": "Kartervaring", "lv1": "Beginner (nog nooit of bijna nooit gereden)", "lv2": "Af en toe (al een paar keer gereden)", "lv3": "Regelmatig (heeft al vaak gereden)", "size": "Kledingmaat", "allergies": "Allergieën of speciale voeding", "optional": "(niet verplicht)", "optionalP": "(niet verplicht)", "doctor": "Huisarts (naam en telefoonnummer)", "parentH": "Jouw gegevens", "parent": "Voornaam en familienaam", "phone": "Gsm", "email": "E-mail", "address": "Adres (straat, nummer, postcode, gemeente)", "consent": "Ik ga ermee akkoord dat Experience Factory Antwerp deze gegevens, ook de medische gegevens van mijn kind, alleen gebruikt om het kamp te organiseren.", "photos": "Mijn kind mag tijdens het kamp gefotografeerd en gefilmd worden. Experience Factory Antwerp mag die foto's en filmpjes gebruiken op de website en op sociale media.", "total": "Totaal:", "send": "Mijn kind inschrijven", "sending": "Even geduld…", "errMissing": "Vul alle verplichte velden in en vink het eerste vakje aan.", "errEmail": "Kijk het e-mailadres even na.", "errNet": "Het versturen is niet gelukt. Controleer je internetverbinding en probeer het opnieuw.", "privacy": "We gebruiken deze gegevens alleen voor de organisatie van het kamp en geven ze aan niemand door.", "thanks": "Bedankt, je inschrijving is binnen!", "thanksText": "We sturen je een overzicht naar {email}. Je inschrijving is definitief zodra het voorschot op deze rekening staat:", "holder": "Begunstigde:", "ibanL": "IBAN:", "bicL": "BIC:", "comm": "Mededeling:", "amount": "Bedrag:", "another": "Nog een kind inschrijven", "fullT": "Het kamp is volzet.", "fullText": "Wil je op de wachtlijst staan? Stuur dan een mailtje naar antwerp@experience-factory.com.", "testBanner": "TESTMODUS: deze inschrijving telt niet mee."}, "en": {"title": "Carnaval Camp registration", "lead": "5 days of karting at Experience Factory Antwerp, from Monday 8 to Friday 12 February 2027, during the Flemish February holiday (krokusvakantie).", "prog": "Karting theory and track training, races with a podium ceremony, sport and adventure activities.", "langs": "Camp languages: Dutch and English.", "price": "€500 per child, meals and drinks included.", "deposit": "The registration is confirmed once we receive a €275 deposit.", "balance": "The balance is paid at reception on the first day of the camp at the latest.", "one": "One form per child.", "kidH": "The child", "first": "First name", "last": "Last name", "dob": "Date of birth", "kidLang": "Language spoken", "kNL": "Dutch", "kEN": "English", "kFR": "French", "other": "Other", "level": "Karting experience", "lv1": "Beginner (never or hardly ever)", "lv2": "Occasional (a few sessions)", "lv3": "Regular (drives often)", "size": "Clothing size", "allergies": "Allergies or diet", "optional": "(optional)", "optionalP": "(optional)", "doctor": "Family doctor and phone number", "parentH": "Your contact details", "parent": "First and last name", "phone": "Phone", "email": "Email", "address": "Address (street, number, postcode, town)", "consent": "I agree that Experience Factory Antwerp uses this information, including my child's health information, only to organise the camp.", "photos": "I allow Experience Factory Antwerp to photograph and film my child during the camp and to publish these photos and videos on its website and social media.", "total": "Total:", "send": "Register my child", "sending": "Sending…", "errMissing": "Please fill in the required fields and tick the first box.", "errEmail": "Please check the email address.", "errNet": "Sending failed. Check your connection and try again.", "privacy": "This information is only used to organise the camp and is never shared.", "thanks": "Thank you!", "thanksText": "We have sent an email with all the details to {email}. The registration is confirmed once we receive the deposit on the following account:", "holder": "Account holder:", "ibanL": "IBAN:", "bicL": "BIC:", "comm": "Reference:", "amount": "Amount:", "another": "Register another child", "fullT": "The camp is full.", "fullText": "For the waiting list, email us at antwerp@experience-factory.com.", "testBanner": "TEST MODE: this registration does not count."}};
const q = new URLSearchParams(location.search), TEST = q.get('test') === '1';
const $ = id => document.getElementById(id);
let L = (q.get('lang') || navigator.language || 'nl').slice(0, 2).toLowerCase();
if (!T[L]) L = 'nl';
function money(n) { return L === 'en' ? '€' + n : '€ ' + n; }
let sentEmail = '';
function setLang(l) {
  L = l; document.documentElement.lang = l;
  if (sentEmail) $('thanksText').textContent = T[l].thanksText.replace('{email}', sentEmail);
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T[l][el.dataset.t]; });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === l));
  total();
}
function nights() { const r = document.querySelector('input[name=nights]:checked'); return r ? r.value === 'yes' : false; }
function total() { $('total').textContent = T[L].total + ' ' + money(PRICE + (nights() ? NIGHTS : 0)); $('dep').textContent = money(DEPOSIT); }
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => setLang(b.dataset.l));
document.querySelectorAll('input[name=nights]').forEach(r => r.onchange = total);
if (TEST) $('testbar').classList.remove('hidden');
setLang(L);

function show(v) { ['formView', 'doneView', 'fullView'].forEach(x => $(x).classList.toggle('hidden', x !== v)); window.scrollTo(0, 0); }
if (API && !TEST) fetch(API).then(r => r.json()).then(j => {
  if (j.ok && j.camps && j.camps[CAMP] && j.camps[CAMP].open === false) show('fullView');
}).catch(() => {});

const err = $('err'), send = $('send');
send.onclick = async () => {
  err.textContent = '';
  const d = { camp: CAMP, lang: L, test: TEST, website: $('website').value,
              first: $('first').value.trim(), last: $('last').value.trim(), dob: $('dob').value,
              kidLang: $('kidLang').value, level: $('level').value, allergies: $('allergies').value.trim(),
              doctor: $('doctor').value.trim(), nights: nights(), parent: $('parent').value.trim(),
              phone: $('phone').value.trim(), email: $('email').value.trim(), address: $('address').value.trim(),
              consent: $('ok').checked, photos: $('photos').checked, size: $('size') ? $('size').value : '' };
  if (!d.first || !d.last || !d.dob || !d.kidLang || !d.level || !d.doctor || d.nights === null
      || !d.parent || !d.phone || !d.email || !d.address || !d.consent) { err.textContent = T[L].errMissing; return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) { err.textContent = T[L].errEmail; return; }
  send.disabled = true; send.textContent = T[L].sending;
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(d) });
    const j = await r.json();
    if (j.error === 'full') { show('fullView'); return; }
    if (!j.ok) throw new Error(j.error || 'ko');
    sentEmail = d.email; $('thanksText').textContent = T[L].thanksText.replace('{email}', d.email);
    $('ref').textContent = REF + ' - ' + d.first + ' ' + d.last.toUpperCase();
    show('doneView');
  } catch (e) {
    err.textContent = T[L].errNet;
  } finally { send.disabled = false; send.textContent = T[L].send; }
};
$('again').onclick = () => {
  ['first', 'last', 'dob', 'allergies'].forEach(id => { $(id).value = ''; });
  $('level').value = ''; $('ok').checked = false; $('photos').checked = false;
  document.querySelectorAll('input[name=nights]').forEach(r => { r.checked = false; });
  total(); show('formView');
};
})();
</script>
</body>
</html>
